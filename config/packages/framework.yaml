framework:
    secret: '%env(APP_SECRET)%'
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Tests never reach a store: tests/StoreMock.php answers instead.
        http_client:
            mock_response_factory: App\Tests\StoreMock
