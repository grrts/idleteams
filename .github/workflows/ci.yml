name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, postgres]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idleteams_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idleteams_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, intl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pick the database
        run: |
          case "${{ matrix.db }}" in
            mysql)    echo 'DATABASE_URL="mysql://root:root@127.0.0.1:3306/idleteams_test?serverVersion=8.0&charset=utf8mb4"' >> .env.test.local ;;
            postgres) echo 'DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/idleteams_test?serverVersion=16&charset=utf8"' >> .env.test.local ;;
          esac
      - name: Migrations build the schema and match the entities
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/console doctrine:schema:validate --env=test
      - name: Backups run on this database
        run: php bin/console app:backup --env=test --dir=/tmp/backups && ls -l /tmp/backups
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: Balance smoke test
        if: matrix.db == 'sqlite'
        run: php bin/console app:balance --env=test
      - name: Pacing (level 50 in 6 to 8 days for an engaged group)
        if: matrix.db == 'sqlite'
        run: php bin/console app:pacing --env=test
      - name: Crowd check (under 1% exact look duplicates in 250 random heroes)
        if: matrix.db == 'sqlite'
        run: php bin/console app:crowd --env=test

  browser-build:
    name: Playable build is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php bin/console app:browser-data
      - name: browser-build/data.js matches the PHP rules
        run: git diff --exit-code --stat browser-build/
